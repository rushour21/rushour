<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBC85B"/>
      <stop offset="100%" stop-color="#F08A34"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0.05" y1="1" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#1B3FD1"/>
      <stop offset="55%" stop-color="#3E6DF0"/>
      <stop offset="100%" stop-color="#6FC3FA"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="domeClip">
      <rect x="0" y="0" width="400" height="230"/>
    </clipPath>
  </defs>

  <!-- sun -->
  <g clip-path="url(#domeClip)">
    <circle cx="200" cy="234" r="148" fill="url(#sunGrad)"/>
  </g>

  <!-- white halo separating the road from the sun and from itself -->
  <path fill="#FFFFFF"
    d="M172 210
       C 144 236 100 266 74 304
       C 56 330 46 350 42 368
       C 41 374 41 379 44 384
       C 47 389 53 392 60 392
       L 148 392
       C 155 392 160 388 161 381
       C 163 361 171 338 187 313
       C 200 292 216 273 230 254
       C 220 242 198 226 172 210 Z

       M 216 238
       C 240 216 270 202 302 202
       C 342 202 368 228 368 264
       C 368 292 352 313 328 324
       C 344 340 362 358 378 376
       C 385 384 383 392 373 392
       L 262 392
       C 255 392 250 388 249 381
       C 246 363 236 344 220 324
       C 208 310 200 297 197 284
       C 194 266 200 250 216 238 Z"/>

  <!-- the road, shaped into an R: left leg -->
  <path fill="url(#roadGrad)"
    d="M172 210
       C 144 236 100 266 74 304
       C 56 330 46 350 42 368
       C 41 374 41 379 44 384
       C 47 389 53 392 60 392
       L 148 392
       C 155 392 160 388 161 381
       C 163 361 171 338 187 313
       C 200 292 216 273 230 254
       C 220 242 198 226 172 210 Z"/>

  <!-- bowl + right diagonal leg -->
  <path fill="url(#roadGrad)"
    d="M216 238
       C 240 216 270 202 302 202
       C 342 202 368 228 368 264
       C 368 292 352 313 328 324
       C 344 340 362 358 378 376
       C 385 384 383 392 373 392
       L 262 392
       C 255 392 250 388 249 381
       C 246 363 236 344 220 324
       C 208 310 200 297 197 284
       C 194 266 200 250 216 238 Z"/>

  <!-- bowl counter, so the loop of the R reads clearly -->
  <path fill="#FFFFFF"
    d="M254 238
       C 268 224 285 216 302 216
       C 326 216 344 234 344 258
       C 344 280 328 296 306 300
       C 300 282 288 262 272 248
       C 266 243 260 240 254 238 Z"/>

  <!-- shine down the left leg, echoing a road centre-line -->
  <path fill="url(#shineGrad)"
    d="M166 218
       C 138 244 98 272 72 306
       C 61 321 53 335 48 349
       L 60 353
       C 65 340 73 326 84 312
       C 108 280 142 252 172 226 Z"/>
</svg>
